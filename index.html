<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordBook — Kişisel Kelime Defteri</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">WordBook — Kişisel Kelime Defteri</span>
      <span class="text-white-50 small">LocalStorage Destekli</span>
    </div>
  </nav>

  <main class="container pb-5">
    <!-- Summary stats row -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm text-center p-3">
          <div class="text-muted small">Toplam Kelime</div>
          <div id="totalCount" class="fs-3 fw-bold text-primary">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm text-center p-3">
          <div class="text-muted small">Öğrenildi</div>
          <div id="learnedCount" class="fs-3 fw-bold text-success">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm text-center p-3">
          <div class="text-muted small">Tekrar Edilecek</div>
          <div id="pendingCount" class="fs-3 fw-bold text-warning">0</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Add word form -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white fw-semibold">Yeni Kelime Ekle</div>
          <div class="card-body">
            <form id="wordForm">
              <div class="mb-3">
                <label for="englishInput" class="form-label">İngilizce Kelime</label>
                <input type="text" id="englishInput" class="form-control" placeholder="Örn: resilient" required />
              </div>
              <div class="mb-3">
                <label for="turkishInput" class="form-label">Türkçe Anlamı</label>
                <input type="text" id="turkishInput" class="form-control" placeholder="Örn: dayanıklı" required />
              </div>
              <div class="mb-3">
                <label for="exampleInput" class="form-label">Örnek Cümle (İsteğe Bağlı)</label>
                <textarea id="exampleInput" class="form-control" rows="2" placeholder="Örn: She is very resilient under pressure."></textarea>
              </div>
              <div class="mb-3">
                <label for="categoryInput" class="form-label">Kategori</label>
                <select id="categoryInput" class="form-select">
                  <option value="Günlük">Günlük</option>
                  <option value="Akademik">Akademik</option>
                  <option value="Yazılım">Yazılım</option>
                  <option value="İş">İş</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary w-100">Deftere Kaydet</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Word list & filter -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center">
            <span class="fw-semibold">Kayıtlı Kelimeler</span>
            <div class="d-flex gap-2">
              <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Kelime ara..." />
              <select id="filterSelect" class="form-select form-select-sm">
                <option value="all">Tümü</option>
                <option value="pending">Tekrar Edilecek</option>
                <option value="learned">Öğrenildi</option>
              </select>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Kelime</th>
                    <th>Anlamı & Örnek</th>
                    <th>Kategori</th>
                    <th class="text-end">İşlemler</th>
                  </tr>
                </thead>
                <tbody id="wordTableBody"></tbody>
              </table>
            </div>
            <div id="emptyState" class="text-center text-muted py-4 d-none">
              Aradığınız kritere uygun kelime bulunamadı.
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
